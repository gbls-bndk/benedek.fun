<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benedek Göbölös</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="shutter/icon.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --ink: #fff;
    --muted: rgba(255, 255, 255, 0.5);
    --card: #141414;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: -0.022em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 88px 24px 96px;
  }

  h1 {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  .app {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px 16px 16px;
    border-radius: 26px;
    background: var(--card);
    color: inherit;
    text-decoration: none;
  }

  .app img { width: 56px; height: 56px; flex: none; }

  .app strong {
    display: block;
    font-size: 14px;
    line-height: 1.3;
    font-weight: 900;
    font-stretch: expanded;
    text-transform: uppercase;
    letter-spacing: 0;
  }

  .app span { color: var(--muted); font-size: 15px; }

  .app:hover span { color: var(--ink); }

  @media (max-width: 480px) {
    main { padding: 56px 20px 72px; }
  }
</style>
</head>
<body>
<main>
  <h1>Benedek Göbölös</h1>
  <a class="app" href="shutter/privacy-policy">
    <img src="shutter/icon.png" width="56" height="56" alt="">
    <div>
      <strong>Shutter</strong>
      <span>Privacy Policy</span>
    </div>
  </a>
</main>
</body>
</html>
