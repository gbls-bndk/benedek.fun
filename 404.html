<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/shutter/icon.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --ink: #fff;
    --muted: rgba(255, 255, 255, 0.5);
    --faint: rgba(255, 255, 255, 0.32);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--muted);
    font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: -0.022em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 88px 24px 96px;
  }

  h1 {
    margin: 0 0 14px;
    color: var(--ink);
    font-size: 34px;
    line-height: 1.05;
    font-weight: 900;
    font-stretch: expanded;
    text-transform: uppercase;
    letter-spacing: 0;
  }

  p { margin: 0; }

  a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-decoration-color: var(--faint);
    text-underline-offset: 3px;
  }

  @media (max-width: 480px) {
    main { padding: 56px 20px 72px; }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>There’s nothing at this address. <a href="/">Go to benedek.fun</a></p>
</main>
</body>
</html>
